# Cut a release: build the xcframework, check it against the checksum the tree
# already carries, publish it as a checksummed asset, and tag.
#
# Nothing is written to main. The tree must already carry the checksum this
# build produces, so a release is a two-step affair whenever the checksum moves:
# a pull request that restamps release.env and Package.swift, then a dispatch.
#
# The pod is not pushed from here. SENTZ-5561 deprecates the LibMobileCoin pod
# and SENTZ-5551 moves the remaining consumer to SwiftPM, so a trunk token is
# not recreated on this repository. `make publish-podspec` still pushes one by
# hand for anyone who needs it.
#
# Runs on workflow_dispatch, not on a tag push, because the tag has to point at
# a commit whose manifest already matches the built asset, and that is only
# known after the Rust build. The workflow therefore builds first, then tags.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the archive without tagging or publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    # The Rust build covers five targets from a cold cache.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # Not a tidy-up target. The default checkout fetches no tags, which
          # leaves "Refuse to reuse an existing tag" blind and turns an early
          # clean failure into a push rejection after the whole Rust build.
          fetch-depth: 0
          persist-credentials: true

      # The checkout follows the dispatched ref, so a dry run exercises the
      # branch it was dispatched on.
      - name: Refuse to release from anything but main
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "error: a release must be dispatched from main, got ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Read release settings
        id: settings
        run: |
          set -euo pipefail
          . ./release.env
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse an existing tag
        env:
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "error: ${TAG} already exists. Bump VERSION in release.env." >&2
            exit 1
          fi

      # Both checks read the checkout alone, so they run ahead of the vendor
      # fetch, the dependency install and the five-target Rust build.
      - name: Assert the public headers compile
        run: make check-headers

      # make setup patches the runner's cmake module, so a release proves the
      # pair round trips before it patches anything.
      - name: Assert the cmake patch pair round trips
        run: make check-cmake-patch

      # setup and build both depend on this target, so fetching here only
      # moves a bad rev's failure ahead of the dependency install.
      - name: Fetch the pinned foundation revision
        run: make vendor

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew update-reset
          brew bundle --no-upgrade

      - name: Install Rust
        run: |
          set -euo pipefail
          command -v rustup >/dev/null \
            || curl https://sh.rustup.rs --tlsv1.2 -sSf | sh -s -- -y --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      # Vendor/mobilecoin is fetched at the revision in Vendor/mobilecoin.rev,
      # so the cache key has to include it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libmobilecoin
          key: ${{ hashFiles('Vendor/mobilecoin.rev', 'libmobilecoin/Cargo.lock') }}

      - name: Build the xcframework
        run: make setup build clean-artifacts copy

      - name: Package and stamp release.env
        run: make stamp

      # No checksum comparison here. The only value available at this point
      # comes from `make stamp`, which derived it from this very zip, so it
      # could only ever agree with itself. The build is compared against the
      # committed manifest further down, in "Refuse to release a tree the
      # build restamped".
      - name: Verify the archive opens
        run: |
          set -euo pipefail
          unzip -qt .build/LibMobileCoinLibrary.xcframework.zip

      # Two runs of the packager over one xcframework must agree, otherwise a
      # consumer can resolve a checksum the manifest never carried.
      - name: Verify the packaging is reproducible
        run: |
          set -euo pipefail
          FIRST="$(shasum -a 256 .build/LibMobileCoinLibrary.xcframework.zip | cut -d' ' -f1)"
          tools/package-xcframework.sh \
            .build/mc-artifacts/LibMobileCoinLibrary.xcframework \
            .build/repack.zip > /dev/null
          SECOND="$(shasum -a 256 .build/repack.zip | cut -d' ' -f1)"
          rm -f .build/repack.zip
          [ "$FIRST" = "$SECOND" ] || {
            echo "error: repacking the same xcframework changed the checksum" >&2
            echo "  first:  $FIRST" >&2
            echo "  second: $SECOND" >&2
            exit 1
          }

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibMobileCoinLibrary.xcframework.zip
          path: .build/LibMobileCoinLibrary.xcframework.zip
          retention-days: 7

      # Cheap, and it runs before anything is pushed. A dependency's manifest is
      # compiled through a VFS overlay with no rest of the checkout, so a file
      # read in it works at the repo root and fails for every consumer.
      - name: Assert the manifest evaluates as a dependency
        run: |
          set -euo pipefail
          . ./release.env
          DEP=$(mktemp -d)
          git clone --quiet --local . "$DEP/libmobilecoin"
          git -C "$DEP/libmobilecoin" tag -f "$VERSION"
          APP=$(mktemp -d)
          mkdir -p "$APP/Sources/App"
          echo 'public let a = 1' > "$APP/Sources/App/App.swift"
          cat > "$APP/Package.swift" <<EOF
          // swift-tools-version:5.7
          import PackageDescription
          let package = Package(
              name: "App",
              platforms: [.iOS(.v13), .macOS(.v11)],
              dependencies: [.package(url: "$DEP/libmobilecoin", exact: "$VERSION")],
              targets: [.target(name: "App")])
          EOF
          # resolve, not dump-package: dump-package reads only the ROOT manifest and
          # exits 0 even when the dependency's manifest cannot compile.
          # The artifact is not published yet at release time, so only a manifest
          # error is fatal here. The consumer resolve after publish covers the rest.
          cd "$APP"
          set +e
          swift package resolve > resolve.log 2>&1
          set -e
          if grep -q "Invalid manifest" resolve.log; then
            echo "error: the dependency manifest failed to compile under the VFS overlay" >&2
            cat resolve.log >&2
            exit 1
          fi

      # This workflow never writes to main. The default-branch ruleset requires
      # a pull request and GitHub Actions cannot be a bypass actor, so a push
      # that moved main would be rejected and, being atomic with the tag, take
      # the tag down with it.
      #
      # Not writing means the tree has to already carry the checksum this build
      # produced. The repack check above proves the packager is deterministic
      # over one xcframework; nothing here proves two Rust builds produce the
      # same xcframework. So a mismatch is either a real defect or a build input
      # that moved, and both need the same restamping pull request.
      #
      # `git diff HEAD`, not `git diff`: the plain form compares to the index,
      # so it is blind to a change something staged but did not commit.
      - name: Refuse to release a tree the build restamped
        run: |
          set -euo pipefail
          git diff HEAD --quiet -- release.env Package.swift || {
            git --no-pager diff HEAD -- release.env Package.swift >&2
            echo "error: this build produced a different checksum than the tree carries." >&2
            echo "Open a pull request with the restamped release.env and Package.swift," >&2
            echo "then dispatch this workflow again from main." >&2
            exit 1
          }

      - name: Tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create the release and upload the asset
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            .build/LibMobileCoinLibrary.xcframework.zip

      # `gh release create` returns before the asset is servable, so the resolve
      # below 404s on a release that is fine. The v6.1.0 run failed that way.
      #
      # Poll the URL rather than retry the resolve. The resolve spends about
      # thirty seconds on the dependency graph before it reaches the asset, so
      # every retry pays that again. The 404 itself took 137 ms.
      #
      # --max-time is what bounds the wait. curl's own status is tolerated here,
      # so without a transfer limit a connection that accepts and never answers
      # makes every round unbounded.
      - name: Wait for the release asset to be servable
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/LibMobileCoinLibrary.xcframework.zip"
          ATTEMPTS=30
          DELAY=10
          CODE=""
          for i in $(seq "${ATTEMPTS}"); do
            CODE="$(curl --silent --location --head --output /dev/null \
              --connect-timeout 10 --max-time 15 \
              --write-out '%{http_code}' "$URL")" || CODE="curl exited $?"
            if [ "${CODE}" = "200" ]; then
              echo "asset servable on try ${i} of ${ATTEMPTS}"
              exit 0
            fi
            echo "try ${i}: ${URL} returned ${CODE}"
            sleep "${DELAY}"
          done
          echo "error: ${URL} returned ${CODE} on all ${ATTEMPTS} tries, ${DELAY}s apart" >&2
          exit 1

      # Resolving from the published tag is the only check that proves a
      # consumer can install this release.
      - name: Resolve the published release as a consumer would
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          mkdir -p "${CONSUMER}/Sources/Consumer"
          echo 'import LibMobileCoinCommon' > "${CONSUMER}/Sources/Consumer/Consumer.swift"
          cat > "${CONSUMER}/Package.swift" <<EOF
          // swift-tools-version:5.7
          import PackageDescription
          let package = Package(
              name: "Consumer",
              platforms: [.iOS(.v13), .macOS(.v11)],
              dependencies: [
                  .package(url: "https://github.com/${{ github.repository }}.git", exact: "${{ steps.settings.outputs.version }}")
              ],
              targets: [
                  .target(name: "Consumer", dependencies: [
                      .product(name: "LibMobileCoinCore", package: "libmobilecoin")
                  ])
              ]
          )
          EOF
          swift build --package-path "${CONSUMER}"
