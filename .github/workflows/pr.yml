name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The version in release.env is bumped on main BEFORE the release exists, so
  # for one commit there is no asset to download. Every job that would fetch it
  # keys off this.
  release-asset:
    name: Check whether the release asset exists
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
      version: ${{ steps.probe.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          set -euo pipefail
          . ./release.env
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/LibMobileCoinLibrary.xcframework.zip"
          # Branch on the status, not on curl's exit. A DNS blip or a 5xx would
          # otherwise read as "no asset" and skip every job that verifies anything.
          CODE="$(curl --silent --location --head --output /dev/null \
            --retry 3 --retry-all-errors --write-out '%{http_code}' "$URL")"
          case "$CODE" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No asset for v${VERSION} yet. Skipping the jobs that download it." ;;
            *)
              echo "error: probing $URL returned $CODE, which is neither 200 nor 404" >&2
              exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  shell:
    name: Lint shell scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ubuntu runner image ships shellcheck, so this job installs nothing.
      - name: Lint
        run: shellcheck tools/*.sh

      # One file per call. `bash -n a.sh b.sh` parses only the first file and
      # passes the remaining names to it as positional parameters.
      - name: Parse
        run: |
          set -euo pipefail
          for f in tools/*.sh; do
            bash -n "$f"
          done

      # The runner image ships shellcheck but no actionlint. actionlint parses
      # the workflow schema and pipes each `run:` block through shellcheck.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          TAR="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TAR}"
          curl --silent --show-error --location --fail \
            --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/${TAR}" "$URL"
          # The checksum is what makes the version pin mean anything.
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${TAR}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${TAR}" -C "${RUNNER_TEMP}" actionlint
          # Half the check is the shellcheck pass, and actionlint stays silent
          # when the binary is absent rather than failing.
          command -v shellcheck >/dev/null || {
            echo "error: shellcheck is missing, so the run: blocks go unread" >&2
            exit 1
          }
          "${RUNNER_TEMP}/actionlint" \
            .github/workflows/pr.yml .github/workflows/release.yml

  manifest:
    name: Manifest and checkout shape
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # A consumer checkout must not need git-lfs or any submodule. Prove it by
      # resolving with neither configured.
      - name: Assert the checkout carries no submodules
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            echo "error: .gitmodules is back; SwiftPM consumers will clone it" >&2
            exit 1
          fi
          if git ls-tree -r HEAD | grep -E '^160000 '; then
            echo "error: a gitlink survived with no .gitmodules entry" >&2
            exit 1
          fi

      # The binary lives in the release asset, so nothing here routes through
      # git-lfs and no build output is tracked. Three separate failures, so
      # three checks: a committed pointer, a rule that lets the next one in,
      # and a binary committed as a plain blob with no pointer at all.
      #
      # Every check reads a status explicitly. `if git grep ...` cannot be used
      # here, because `set -e` is suspended in an `if` condition and git's
      # 128 is then indistinguishable from grep's "no match", so a bad ref or a
      # broken git would read as clean.
      - name: Assert the checkout carries no git-lfs rule and no binary
        run: |
          set -euo pipefail

          # The acceptance criterion names this instrument, so its absence has
          # to fail rather than silently skip the only check that proves it.
          # The GitHub macOS image ships it and nothing here installs it, so a
          # slimmer or self-hosted runner has to carry it in the image.
          command -v git-lfs >/dev/null || {
            echo "error: git-lfs is missing, so the ls-files check cannot run" >&2
            exit 1
          }
          pointers="$(git lfs ls-files)"
          [ -z "$pointers" ] || {
            echo "$pointers"
            echo "error: a git-lfs pointer is tracked; the binary belongs in the release asset" >&2
            exit 1
          }

          # git grep exits 0 on a match and 1 on none. Anything above that is a
          # failure to answer, not an answer.
          rc=0
          rules="$(git grep -n 'filter=lfs' HEAD -- '*.gitattributes')" || rc=$?
          [ "$rc" -le 1 ] || {
            echo "error: git grep failed with status $rc" >&2
            exit 1
          }
          [ -z "$rules" ] || {
            echo "$rules"
            echo "error: a git-lfs rule is back; it re-arms LFS for the next matching file" >&2
            exit 1
          }

          # A plain blob needs no pointer and no rule, so neither check above
          # sees it. Note git tracks the files inside a bundle, never the
          # bundle directory, so the pattern has to match a path component.
          files="$(git ls-tree -r --name-only HEAD)"
          rc=0
          binaries="$(printf '%s\n' "$files" | grep -Ei '\.(a|o|zip|dylib|so|tgz)$|\.tar\.gz$|\.(xc)?framework/|(^|/)Artifacts/')" || rc=$?
          [ "$rc" -le 1 ] || {
            echo "error: grep failed with status $rc" >&2
            exit 1
          }
          [ -z "$binaries" ] || {
            echo "$binaries"
            echo "error: a binary or an Artifacts path is back in the tree" >&2
            exit 1
          }

      # release.env is the source of truth, Package.swift carries the literals.
      # This is what catches a bump that forgot `make stamp-manifest`.
      - name: Assert Package.swift agrees with release.env
        run: make check-manifest

      # The release zip carries its own copy of these headers, which is why
      # this copy needs its own check.
      - name: Assert the public headers compile
        run: make check-headers

      # A dependency's manifest is compiled through a VFS overlay with no rest
      # of the checkout, so any file read in it fails for every consumer while
      # still working at the repo root. Resolve it as a real git dependency.
      - name: Assert the manifest evaluates as a dependency
        run: |
          set -euo pipefail
          . ./release.env
          DEP=$(mktemp -d)
          git clone --quiet --local . "$DEP/libmobilecoin"
          git -C "$DEP/libmobilecoin" tag -f "$VERSION"
          APP=$(mktemp -d)
          mkdir -p "$APP/Sources/App"
          echo 'public let a = 1' > "$APP/Sources/App/App.swift"
          cat > "$APP/Package.swift" <<EOF
          // swift-tools-version:5.7
          import PackageDescription
          let package = Package(
              name: "App",
              platforms: [.iOS(.v13), .macOS(.v11)],
              dependencies: [.package(url: "$DEP/libmobilecoin", exact: "$VERSION")],
              targets: [.target(name: "App")])
          EOF
          # resolve, not dump-package: dump-package reads only the ROOT manifest and
          # exits 0 even when the dependency's manifest cannot compile.
          # The artifact is not published yet at release time, so only a manifest
          # error is fatal here. The consumer resolve after publish covers the rest.
          cd "$APP"
          set +e
          swift package resolve > resolve.log 2>&1
          set -e
          if grep -q "Invalid manifest" resolve.log; then
            echo "error: the dependency manifest failed to compile under the VFS overlay" >&2
            cat resolve.log >&2
            exit 1
          fi

  swiftpm:
    name: SwiftPM resolve and build
    runs-on: macos-26
    needs: release-asset
    if: needs.release-asset.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      # resolve downloads the binaryTarget and verifies its checksum, so a stale
      # or wrong XCFRAMEWORK_SHA256 fails here.
      - name: Resolve
        run: swift package resolve

      - name: Build
        run: swift build

  test-spm:
    name: Example package tests
    runs-on: macos-26
    needs: release-asset
    if: needs.release-asset.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      # The example test bundle links the published xcframework, so a symbol
      # the released library does not export fails here at the link step.
      - name: Test
        run: make test-spm

  podspec:
    name: pod lib lint
    runs-on: macos-26
    needs: release-asset
    if: needs.release-asset.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # No --subspec, because that is what `pod trunk push` runs. The validator
      # builds every subspec and groups the ones sharing a dependency set, so a
      # conflict between two subspecs surfaces here and nowhere else. Each group
      # is labelled in the log, so a failure names the subspec it came from.
      - name: Lint
        run: bundle exec pod lib lint LibMobileCoin.podspec --allow-warnings
